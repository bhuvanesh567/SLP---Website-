<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111122"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="counter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e35"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <radialGradient id="spotLight1" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="spotLight2" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(6,182,212,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background / Ceiling -->
  <rect width="800" height="500" fill="url(#wall)"/>

  <!-- Spotlights -->
  <ellipse cx="200" cy="0" rx="180" ry="260" fill="url(#spotLight1)"/>
  <ellipse cx="600" cy="0" rx="180" ry="260" fill="url(#spotLight2)"/>

  <!-- Back wall display shelves -->
  <rect x="0" y="50" width="800" height="200" fill="rgba(20,20,40,0.6)"/>
  
  <!-- Shelf units on back wall -->
  <rect x="40" y="60" width="160" height="170" rx="4" fill="rgba(30,30,55,0.8)" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
  <rect x="220" y="60" width="160" height="170" rx="4" fill="rgba(30,30,55,0.8)" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
  <rect x="400" y="60" width="160" height="170" rx="4" fill="rgba(30,30,55,0.8)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <rect x="580" y="60" width="180" height="170" rx="4" fill="rgba(30,30,55,0.8)" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>

  <!-- Phones on shelves - simplified representations -->
  <!-- Shelf 1 -->
  <rect x="65" y="90" width="28" height="55" rx="4" fill="rgba(200,200,210,0.9)"/>
  <rect x="100" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>
  <rect x="135" y="90" width="28" height="55" rx="4" fill="rgba(180,180,190,0.9)"/>
  <rect x="170" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>
  <!-- Shelf 2 -->
  <rect x="240" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>
  <rect x="275" y="90" width="28" height="55" rx="4" fill="rgba(15,25,50,0.9)"/>
  <rect x="310" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>
  <rect x="345" y="90" width="28" height="55" rx="4" fill="rgba(10,10,20,0.9)"/>
  <!-- Shelf 3 -->
  <rect x="420" y="90" width="28" height="55" rx="4" fill="rgba(200,210,200,0.9)"/>
  <rect x="455" y="90" width="28" height="55" rx="4" fill="rgba(15,25,50,0.9)"/>
  <rect x="490" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>
  <rect x="525" y="90" width="28" height="55" rx="4" fill="rgba(200,200,210,0.9)"/>
  <!-- Shelf 4 -->
  <rect x="600" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>
  <rect x="635" y="90" width="28" height="55" rx="4" fill="rgba(15,25,50,0.9)"/>
  <rect x="670" y="90" width="28" height="55" rx="4" fill="rgba(200,200,210,0.9)"/>
  <rect x="705" y="90" width="28" height="55" rx="4" fill="rgba(20,20,30,0.9)"/>

  <!-- Shelf labels with brand glow -->
  <text x="120" y="176" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Apple</text>
  <text x="300" y="176" font-family="Arial,sans-serif" font-size="11" fill="rgba(150,180,255,0.5)" text-anchor="middle">Samsung</text>
  <text x="480" y="176" font-family="Arial,sans-serif" font-size="11" fill="rgba(100,200,100,0.5)" text-anchor="middle">OnePlus</text>
  <text x="670" y="176" font-family="Arial,sans-serif" font-size="11" fill="rgba(100,150,255,0.5)" text-anchor="middle">Google</text>

  <!-- LED shelf lighting -->
  <rect x="40" y="58" width="160" height="3" rx="2" fill="rgba(37,99,235,0.8)"/>
  <rect x="220" y="58" width="160" height="3" rx="2" fill="rgba(37,99,235,0.6)"/>
  <rect x="400" y="58" width="160" height="3" rx="2" fill="rgba(6,182,212,0.8)"/>
  <rect x="580" y="58" width="180" height="3" rx="2" fill="rgba(37,99,235,0.6)"/>

  <!-- Floor -->
  <rect x="0" y="250" width="800" height="250" fill="url(#floor)"/>

  <!-- Floor reflection lines (perspective) -->
  <line x1="0" y1="250" x2="400" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="100" y1="250" x2="450" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="200" y1="250" x2="500" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="400" y1="250" x2="400" y2="500" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="250" x2="350" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="700" y1="250" x2="300" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="800" y1="250" x2="250" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Main display counter -->
  <rect x="80" y="300" width="620" height="100" rx="8" fill="url(#counter)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
  <rect x="80" y="300" width="620" height="4" rx="2" fill="rgba(37,99,235,0.6)"/>

  <!-- Phones on counter -->
  <rect x="120" y="265" width="32" height="62" rx="5" fill="rgba(240,240,240,0.95)"/>
  <rect x="123" y="268" width="26" height="52" rx="3" fill="#1a1a2e"/>
  <rect x="200" y="260" width="36" height="70" rx="5" fill="rgba(20,20,30,0.95)"/>
  <rect x="203" y="263" width="30" height="60" rx="3" fill="#1a2a4a"/>
  <rect x="290" y="265" width="32" height="62" rx="5" fill="rgba(30,30,40,0.95)"/>
  <rect x="293" y="268" width="26" height="52" rx="3" fill="#0f0505"/>
  <rect x="420" y="260" width="36" height="70" rx="5" fill="rgba(220,230,250,0.95)"/>
  <rect x="423" y="263" width="30" height="60" rx="3" fill="#0d1117"/>
  <rect x="510" y="265" width="32" height="62" rx="5" fill="rgba(240,240,250,0.95)"/>
  <rect x="513" y="268" width="26" height="52" rx="3" fill="#0a0a0a"/>
  <rect x="600" y="260" width="36" height="70" rx="5" fill="rgba(20,20,30,0.95)"/>
  <rect x="603" y="263" width="30" height="60" rx="3" fill="#141428"/>

  <!-- Counter top surface glow -->
  <rect x="80" y="296" width="620" height="8" rx="2" fill="rgba(37,99,235,0.1)"/>

  <!-- Ceiling lights -->
  <circle cx="150" cy="15" r="10" fill="rgba(255,255,200,0.8)"/>
  <circle cx="350" cy="15" r="10" fill="rgba(255,255,200,0.8)"/>
  <circle cx="550" cy="15" r="10" fill="rgba(255,255,200,0.8)"/>
  <circle cx="750" cy="15" r="10" fill="rgba(255,255,200,0.8)"/>
  <!-- Light glow -->
  <circle cx="150" cy="15" r="40" fill="rgba(255,255,200,0.06)"/>
  <circle cx="350" cy="15" r="40" fill="rgba(255,255,200,0.06)"/>
  <circle cx="550" cy="15" r="40" fill="rgba(255,255,200,0.06)"/>

  <!-- Store sign on back wall -->
  <rect x="280" y="10" width="240" height="38" rx="6" fill="rgba(37,99,235,0.2)" stroke="rgba(37,99,235,0.5)" stroke-width="1"/>
  <text x="400" y="34" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="2">SRI LAKSHMI PLAZA</text>
</svg>
