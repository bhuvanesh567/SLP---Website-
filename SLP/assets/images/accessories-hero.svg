<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="accbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#0d0d2a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <radialGradient id="accglow1" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="accglow2" cx="75%" cy="40%" r="40%">
      <stop offset="0%" stop-color="rgba(6,182,212,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#accbg)"/>
  <rect width="800" height="400" fill="url(#accglow1)"/>
  <rect width="800" height="400" fill="url(#accglow2)"/>

  <!-- AirPods Pro - left -->
  <g transform="translate(100, 80)">
    <!-- Case -->
    <rect x="0" y="60" width="120" height="140" rx="30" fill="#f0f0f0"/>
    <rect x="10" y="70" width="100" height="20" rx="5" fill="#e0e0e0"/>
    <!-- Left earbud -->
    <ellipse cx="35" cy="85" rx="18" ry="22" fill="#fff"/>
    <ellipse cx="35" cy="78" rx="8" ry="10" fill="#e8e8e8"/>
    <!-- Right earbud -->
    <ellipse cx="85" cy="85" rx="18" ry="22" fill="#fff"/>
    <ellipse cx="85" cy="78" rx="8" ry="10" fill="#e8e8e8"/>
    <!-- LED -->
    <circle cx="60" cy="186" r="4" fill="rgba(50,200,100,0.8)"/>
    <text x="60" y="225" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">AirPods Pro</text>
  </g>

  <!-- Charging cable / MagSafe charger - center left -->
  <g transform="translate(270, 100)">
    <circle cx="70" cy="80" r="55" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="70" cy="80" r="40" fill="#1a1a2e" stroke="rgba(37,99,235,0.5)" stroke-width="2"/>
    <circle cx="70" cy="80" r="30" fill="rgba(37,99,235,0.2)"/>
    <!-- Charging symbol -->
    <text x="70" y="88" font-family="Arial,sans-serif" font-size="28" fill="rgba(37,99,235,0.9)" text-anchor="middle">⚡</text>
    <!-- Cable -->
    <path d="M70 135 Q70 160 90 170 Q110 180 110 200" stroke="rgba(255,255,255,0.3)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="70" y="225" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">MagSafe</text>
  </g>

  <!-- Phone Case - center -->
  <g transform="translate(420, 60)">
    <rect x="10" y="0" width="100" height="200" rx="18" fill="#2563eb" opacity="0.8"/>
    <rect x="18" y="8" width="84" height="184" rx="14" fill="rgba(0,0,50,0.5)"/>
    <!-- Camera cutout -->
    <rect x="58" y="15" width="38" height="38" rx="10" fill="rgba(0,0,0,0.6)"/>
    <circle cx="77" cy="34" r="10" fill="rgba(0,0,0,0.8)"/>
    <text x="60" y="225" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Phone Case</text>
  </g>

  <!-- Screen Protector / Tempered Glass -->
  <g transform="translate(565, 80)">
    <rect x="10" y="0" width="110" height="180" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect x="16" y="6" width="98" height="168" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(100,200,255,0.2)" stroke-width="0.5"/>
    <!-- Reflection shimmer -->
    <line x1="30" y1="20" x2="100" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
    <text x="65" y="225" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Screen Guard</text>
  </g>

  <!-- Decorative floating dots -->
  <circle cx="50" cy="350" r="3" fill="rgba(37,99,235,0.5)"/>
  <circle cx="200" cy="370" r="2" fill="rgba(6,182,212,0.5)"/>
  <circle cx="400" cy="380" r="3" fill="rgba(37,99,235,0.4)"/>
  <circle cx="600" cy="360" r="2" fill="rgba(6,182,212,0.4)"/>
  <circle cx="750" cy="375" r="3" fill="rgba(37,99,235,0.5)"/>
</svg>
