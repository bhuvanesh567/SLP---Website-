<svg xmlns="http://www.w3.org/2000/svg" width="300" height="580" viewBox="0 0 300 580">
  <defs>
    <linearGradient id="opbody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="50%" stop-color="#2a1010"/>
      <stop offset="100%" stop-color="#0f0505"/>
    </linearGradient>
    <linearGradient id="opscreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0505"/>
      <stop offset="60%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </linearGradient>
    <filter id="opshadow">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="rgba(200,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="20" y="10" width="260" height="560" rx="28" ry="28" fill="url(#opbody)" filter="url(#opshadow)"/>
  <rect x="20" y="10" width="260" height="560" rx="28" ry="28" fill="none" stroke="rgba(200,50,50,0.3)" stroke-width="1"/>
  <!-- Screen -->
  <rect x="28" y="18" width="244" height="544" rx="22" ry="22" fill="url(#opscreen)"/>

  <!-- Alert slider - right side -->
  <rect x="278" y="140" width="6" height="50" rx="3" fill="#f5010c"/>

  <!-- Punch hole -->
  <circle cx="150" cy="42" r="7" fill="#000"/>

  <!-- Screen glow - red accent -->
  <circle cx="150" cy="280" r="110" fill="rgba(200,20,20,0.2)" opacity="0.6"/>
  <circle cx="220" cy="180" r="80" fill="rgba(245,1,12,0.1)" opacity="0.5"/>

  <!-- Time -->
  <text x="150" y="155" font-family="Arial,sans-serif" font-size="56" font-weight="200" fill="white" text-anchor="middle">9:41</text>
  <text x="150" y="183" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Sat, 5 July 2026</text>

  <!-- 1+ logo on screen -->
  <text x="150" y="250" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="rgba(245,1,12,0.6)" text-anchor="middle">1+</text>

  <!-- App icons -->
  <rect x="48" y="330" width="44" height="44" rx="12" fill="rgba(245,1,12,0.3)"/>
  <rect x="108" y="330" width="44" height="44" rx="12" fill="rgba(255,255,255,0.08)"/>
  <rect x="168" y="330" width="44" height="44" rx="12" fill="rgba(37,99,235,0.3)"/>
  <rect x="228" y="330" width="44" height="44" rx="12" fill="rgba(50,200,100,0.3)"/>
  <rect x="48" y="390" width="44" height="44" rx="12" fill="rgba(255,180,0,0.3)"/>
  <rect x="108" y="390" width="44" height="44" rx="12" fill="rgba(150,50,255,0.3)"/>
  <rect x="168" y="390" width="44" height="44" rx="12" fill="rgba(6,182,212,0.3)"/>
  <rect x="228" y="390" width="44" height="44" rx="12" fill="rgba(255,100,0,0.3)"/>

  <!-- Dock -->
  <rect x="32" y="460" width="236" height="64" rx="20" fill="rgba(255,255,255,0.06)"/>
  <rect x="46" y="472" width="44" height="44" rx="12" fill="rgba(245,1,12,0.6)"/>
  <rect x="106" y="472" width="44" height="44" rx="12" fill="rgba(50,200,100,0.6)"/>
  <rect x="166" y="472" width="44" height="44" rx="12" fill="rgba(37,99,235,0.6)"/>
  <rect x="226" y="472" width="44" height="44" rx="12" fill="rgba(255,180,0,0.6)"/>

  <!-- Camera module - top center -->
  <circle cx="150" cy="75" r="28" fill="#111"/>
  <circle cx="150" cy="75" r="20" fill="#1a0808"/>
  <circle cx="150" cy="75" r="13" fill="#050202"/>
  <circle cx="143" cy="68" r="3" fill="rgba(255,255,255,0.4)"/>
  <!-- flash -->
  <circle cx="180" cy="65" r="5" fill="#ffcc44" opacity="0.7"/>

  <text x="150" y="548" font-family="Arial,sans-serif" font-size="11" fill="rgba(200,100,100,0.7)" text-anchor="middle">OnePlus 13</text>
</svg>
