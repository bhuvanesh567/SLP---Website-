<svg xmlns="http://www.w3.org/2000/svg" width="300" height="580" viewBox="0 0 300 580">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="camLens" cx="50%" cy="50%" r="50%" id="lensGrad" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="20" y="10" width="260" height="560" rx="44" ry="44" fill="url(#body)" filter="url(#shadow)"/>
  <!-- Side sheen -->
  <rect x="20" y="10" width="8" height="560" rx="4" fill="rgba(255,255,255,0.6)"/>
  <!-- Screen -->
  <rect x="32" y="22" width="236" height="536" rx="36" ry="36" fill="url(#screen)"/>

  <!-- Dynamic Island -->
  <rect x="108" y="38" width="84" height="26" rx="13" fill="#000"/>

  <!-- Wallpaper glow -->
  <circle cx="150" cy="300" r="100" fill="rgba(37,99,235,0.3)" opacity="0.6"/>
  <circle cx="200" cy="200" r="60" fill="rgba(6,182,212,0.2)" opacity="0.5"/>

  <!-- Clock on screen -->
  <text x="150" y="160" font-family="Arial,sans-serif" font-size="52" font-weight="300" fill="white" text-anchor="middle" opacity="0.9">9:41</text>
  <text x="150" y="190" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">Saturday, 5 July</text>

  <!-- App icons grid -->
  <rect x="60" y="340" width="40" height="40" rx="10" fill="rgba(255,255,255,0.15)"/>
  <rect x="115" y="340" width="40" height="40" rx="10" fill="rgba(255,100,50,0.4)"/>
  <rect x="170" y="340" width="40" height="40" rx="10" fill="rgba(50,150,255,0.4)"/>
  <rect x="225" y="340" width="40" height="40" rx="10" fill="rgba(50,200,100,0.4)"/>
  <rect x="60" y="395" width="40" height="40" rx="10" fill="rgba(200,50,255,0.4)"/>
  <rect x="115" y="395" width="40" height="40" rx="10" fill="rgba(255,200,50,0.4)"/>
  <rect x="170" y="395" width="40" height="40" rx="10" fill="rgba(255,255,255,0.1)"/>
  <rect x="225" y="395" width="40" height="40" rx="10" fill="rgba(50,220,220,0.4)"/>

  <!-- Dock -->
  <rect x="48" y="472" width="204" height="58" rx="18" fill="rgba(255,255,255,0.1)"/>
  <rect x="62" y="482" width="40" height="40" rx="10" fill="rgba(50,150,255,0.6)"/>
  <rect x="117" y="482" width="40" height="40" rx="10" fill="rgba(50,200,100,0.6)"/>
  <rect x="172" y="482" width="40" height="40" rx="10" fill="rgba(255,100,50,0.6)"/>
  <rect x="227" y="482" width="40" height="40" rx="10" fill="rgba(200,50,255,0.6)"/>

  <!-- Camera module -->
  <rect x="160" y="44" width="110" height="105" rx="22" fill="#1a1a1a"/>
  <circle cx="205" cy="75" r="20" fill="#111"/>
  <circle cx="205" cy="75" r="15" fill="#1a2a4a"/>
  <circle cx="205" cy="75" r="8" fill="#0a0a2a"/>
  <circle cx="200" cy="70" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="240" cy="75" r="20" fill="#111"/>
  <circle cx="240" cy="75" r="15" fill="#1a2a4a"/>
  <circle cx="240" cy="75" r="8" fill="#0a0a2a"/>
  <circle cx="235" cy="70" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="222" cy="115" r="16" fill="#111"/>
  <circle cx="222" cy="115" r="11" fill="#1a2a4a"/>
  <circle cx="222" cy="115" r="6" fill="#0a0a2a"/>
  <circle cx="218" cy="111" r="1.5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="190" cy="118" r="4" fill="#222" stroke="#333" stroke-width="1"/>

  <!-- Apple logo hint -->
  <text x="150" y="545" font-family="Arial,sans-serif" font-size="11" fill="rgba(100,100,100,0.8)" text-anchor="middle">iPhone 16 Pro Max</text>
</svg>
