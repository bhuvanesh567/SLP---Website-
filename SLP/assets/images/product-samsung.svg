<svg xmlns="http://www.w3.org/2000/svg" width="300" height="580" viewBox="0 0 300 580">
  <defs>
    <linearGradient id="sbody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1e"/>
    </linearGradient>
    <linearGradient id="sscreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="60%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
    <filter id="sshadow">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="rgba(0,0,100,0.5)"/>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="18" y="8" width="264" height="564" rx="30" ry="30" fill="url(#sbody)" filter="url(#sshadow)"/>
  <!-- Titanium edge highlight -->
  <rect x="18" y="8" width="264" height="564" rx="30" ry="30" fill="none" stroke="rgba(150,150,200,0.3)" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="18" y="8" width="264" height="564" rx="30" ry="30" fill="url(#sscreen)"/>

  <!-- Punch hole camera -->
  <circle cx="150" cy="42" r="8" fill="#000"/>
  <circle cx="150" cy="42" r="4" fill="#1a1a2a"/>

  <!-- Screen glow -->
  <circle cx="150" cy="280" r="120" fill="rgba(20,40,180,0.25)" opacity="0.7"/>
  <circle cx="80" cy="180" r="70" fill="rgba(6,182,212,0.15)" opacity="0.5"/>

  <!-- Time -->
  <text x="150" y="155" font-family="Arial,sans-serif" font-size="58" font-weight="200" fill="white" text-anchor="middle">9:41</text>
  <text x="150" y="183" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Sat, 5 July 2026</text>

  <!-- Status bar -->
  <text x="38" y="28" font-family="Arial,sans-serif" font-size="10" fill="white">9:41</text>
  <rect x="232" y="19" width="28" height="12" rx="3" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="234" y="21" width="20" height="8" rx="2" fill="rgba(50,200,100,0.8)"/>

  <!-- S-Pen slot indicator -->
  <rect x="270" y="350" width="6" height="80" rx="3" fill="rgba(37,99,235,0.8)"/>

  <!-- App icons -->
  <rect x="45" y="330" width="45" height="45" rx="12" fill="rgba(37,99,235,0.4)"/>
  <rect x="105" y="330" width="45" height="45" rx="12" fill="rgba(255,80,80,0.4)"/>
  <rect x="165" y="330" width="45" height="45" rx="12" fill="rgba(50,200,100,0.4)"/>
  <rect x="225" y="330" width="45" height="45" rx="12" fill="rgba(255,180,0,0.4)"/>
  <rect x="45" y="390" width="45" height="45" rx="12" fill="rgba(150,50,255,0.4)"/>
  <rect x="105" y="390" width="45" height="45" rx="12" fill="rgba(6,182,212,0.4)"/>
  <rect x="165" y="390" width="45" height="45" rx="12" fill="rgba(255,255,255,0.1)"/>
  <rect x="225" y="390" width="45" height="45" rx="12" fill="rgba(255,120,0,0.4)"/>

  <!-- Dock -->
  <rect x="30" y="460" width="240" height="65" rx="20" fill="rgba(255,255,255,0.07)"/>
  <rect x="44" y="472" width="44" height="44" rx="12" fill="rgba(37,99,235,0.7)"/>
  <rect x="103" y="472" width="44" height="44" rx="12" fill="rgba(50,200,100,0.7)"/>
  <rect x="162" y="472" width="44" height="44" rx="12" fill="rgba(255,80,80,0.7)"/>
  <rect x="221" y="472" width="44" height="44" rx="12" fill="rgba(255,180,0,0.7)"/>

  <!-- Camera island - top left -->
  <rect x="22" y="22" width="90" height="90" rx="20" fill="#0a0a1a"/>
  <circle cx="55" cy="52" r="18" fill="#111"/>
  <circle cx="55" cy="52" r="12" fill="#1a2a4a"/>
  <circle cx="55" cy="52" r="6" fill="#050515"/>
  <circle cx="50" cy="47" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="88" cy="52" r="15" fill="#111"/>
  <circle cx="88" cy="52" r="10" fill="#1a2a4a"/>
  <circle cx="88" cy="52" r="5" fill="#050515"/>
  <circle cx="55" cy="85" r="14" fill="#111"/>
  <circle cx="55" cy="85" r="9" fill="#1a2a4a"/>
  <circle cx="88" cy="85" r="8" fill="#222" stroke="#1a3a6a" stroke-width="1"/>
  <text x="55" y="115" font-family="Arial,sans-serif" font-size="6" fill="rgba(150,150,200,0.6)" text-anchor="middle">200MP</text>

  <text x="150" y="548" font-family="Arial,sans-serif" font-size="11" fill="rgba(150,150,200,0.7)" text-anchor="middle">Galaxy S25 Ultra</text>
</svg>
